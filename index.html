<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c91831">
  <title>GVCS Student Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:opsz,wght@5..1200,700;5..1200,800&display=swap" rel="stylesheet">
  <style>
    :root{--red:#d31834;--deep:#781120;--ink:#25191b;--muted:#85787a;--line:#eee4e4;--soft:#fff5f5;--paper:#fffdfc;--success:#347442;--shadow:0 15px 35px rgba(103,22,34,.09)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f8f5f4;color:var(--ink);font-family:"DM Sans",sans-serif;min-width:1024px}body:before{content:"GVCS";position:fixed;right:-65px;bottom:-155px;z-index:-1;font:800 290px/1 "Playfair Display";letter-spacing:-27px;color:#edc2c5;filter:blur(10px);opacity:.38;pointer-events:none}
    button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:246px;display:flex;flex-direction:column;background:rgba(255,253,252,.96);border-right:1px solid var(--line);padding:30px 17px;z-index:2}.brand{display:flex;align-items:center;gap:10px;padding:0 12px 34px}.crest{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--red);border:3px solid #ffe0e4;box-shadow:0 0 0 2px var(--red);color:#fff;font:800 17px Georgia}.brand b{font:700 20px "Playfair Display"}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:1.5px;text-transform:uppercase}.nav-label{margin:0 12px 8px;color:#a79a9c;font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase}.nav{display:grid;gap:3px;margin-bottom:25px}.nav button{display:flex;align-items:center;gap:12px;border:0;border-radius:10px;background:transparent;color:#776b6d;padding:11px 12px;text-align:left;font-size:13px;font-weight:600;transition:.2s}.nav button:hover,.nav button.active{background:#fff0f1;color:var(--deep)}.nav button.active{box-shadow:inset 3px 0 var(--red)}.icon{width:18px;text-align:center;font-size:16px}.sidebar-spacer{flex:1}.profile-button{display:flex;align-items:center;gap:10px;border:0;border-top:1px solid var(--line);background:transparent;padding:18px 9px 0;text-align:left}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#843832,#f2b995);color:white;font-size:11px;font-weight:700}.profile-button b{display:block;font-size:12px}.profile-button small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
    main{width:calc(100% - 246px);margin-left:246px;padding:30px 43px 48px;max-width:1600px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:31px}.date{font-size:12px;color:var(--muted);font-weight:600}.date i{color:var(--red);font-style:normal}.top-actions{display:flex;align-items:center;gap:11px}.search{display:flex;align-items:center;gap:7px;width:235px;background:white;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--muted);font-size:12px}.search input{border:0;outline:0;width:100%;background:transparent;font-size:12px;color:var(--ink)}.circle-button{width:37px;height:37px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--deep)}.page-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:25px}.page-header h1{margin:0 0 5px;font:800 34px "Playfair Display";letter-spacing:-1.5px}.page-header p{margin:0;color:var(--muted);font-size:13px}.red-button,.secondary-button{border:0;border-radius:9px;padding:11px 15px;font-size:12px;font-weight:700}.red-button{background:var(--red);color:white;box-shadow:0 8px 17px rgba(211,24,52,.18)}.secondary-button{background:#fff0f1;color:var(--deep)}.small-button{border:0;background:transparent;color:var(--red);font-size:11px;font-weight:700}.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.card-head{display:flex;justify-content:space-between;align-items:center}.card h2{margin:0;font:700 17px "Playfair Display"}.dashboard-grid{display:grid;grid-template-columns:1.38fr .87fr;gap:20px}.schedule-card{padding:22px}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:18px 0}.day{text-align:center;padding:7px;border-radius:9px;color:#998f90;font-size:10px;font-weight:700}.day b{display:block;margin-top:4px;color:#554a4b;font-size:16px}.day.today{background:#fff0f1;color:var(--red)}.day.today b{color:var(--red)}.event{display:grid;grid-template-columns:72px 9px 1fr auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:12px 0}.event time{font-size:11px;font-weight:700}.event time small{display:block;color:var(--muted);font-size:9px;font-weight:500;margin-top:2px}.event-dot{width:8px;height:8px;border-radius:50%;background:var(--red)}.event b{font-size:12px}.event p{margin:3px 0 0;color:var(--muted);font-size:10px}.tag{border-radius:5px;background:#fff0f1;color:#a74350;padding:4px 6px;font-size:9px;font-weight:700}.focus-card{padding:22px;background:var(--deep);color:white;overflow:hidden;position:relative}.focus-card:before{content:"";position:absolute;right:-48px;top:-55px;width:170px;height:170px;border:1px solid rgba(255,255,255,.2);border-radius:50%;box-shadow:0 0 0 28px rgba(255,255,255,.05),0 0 0 55px rgba(255,255,255,.04)}.focus-card h2{position:relative}.focus-time{position:relative;margin:29px 0 17px;font:800 43px/1 "Playfair Display";letter-spacing:-2px}.progress{height:7px;background:rgba(255,255,255,.2);border-radius:10px}.progress i{display:block;width:68%;height:100%;background:#ffc2ca;border-radius:10px}.focus-footer{display:flex;justify-content:space-between;align-items:center;margin-top:13px;font-size:10px}.focus-footer button{border:0;border-radius:7px;background:white;color:var(--deep);padding:8px 10px;font-size:10px;font-weight:700}.lower-grid{display:grid;grid-template-columns:1.1fr .9fr 1fr;gap:20px;margin-top:20px}.mini-card{padding:20px}.announcement-mini{border-top:1px solid var(--line);padding:11px 0;font-size:11px}.announcement-mini:first-of-type{border:0;padding-top:14px}.announcement-mini b{display:block}.announcement-mini p{margin:3px 0;color:var(--muted);font-size:10px}.topic-row{display:flex;gap:7px;margin:14px 0}.topic-row button{border:1px solid #edd9da;border-radius:7px;background:white;color:#a45a63;padding:7px 8px;font-size:10px}.utility{display:flex;gap:9px;align-items:center;border-top:1px solid var(--line);padding:10px 0;font-size:11px;font-weight:600}.utility:first-of-type{border-top:0;padding-top:14px}.status{margin-left:auto;background:#edf7eb;color:#43804a;border-radius:5px;padding:4px 5px;font-size:9px}.trivia-strip{display:flex;align-items:center;gap:13px;border:1px solid #f0d9da;border-radius:14px;background:linear-gradient(90deg,#f9e8e6,#fff9f7);padding:15px 20px;margin-top:20px}.trivia-strip p{margin:0;font-size:12px}.trivia-strip button{margin-left:auto;white-space:nowrap}
    .screen{animation:enter .23s ease;min-height:calc(100vh - 105px)}.list{display:grid;gap:11px}.list-item{display:flex;align-items:center;justify-content:space-between;gap:18px;background:white;border:1px solid var(--line);border-radius:12px;padding:15px 17px;box-shadow:0 8px 22px rgba(96,28,35,.04)}.list-item b{font-size:13px}.list-item p{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.45}.two-column{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}.form-card,.info-card{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}.form-card h2,.info-card h2{margin:0 0 8px;font:700 19px "Playfair Display"}.form-card p,.info-card p{color:var(--muted);font-size:12px;line-height:1.5}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:11px;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 11px;color:var(--ink);font-size:12px}.field textarea{min-height:100px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:19px}.chat-layout{display:grid;grid-template-columns:205px minmax(0,1fr);min-height:560px;border:1px solid var(--line);border-radius:16px;background:white;box-shadow:var(--shadow);overflow:hidden}.hub-list{border-right:1px solid var(--line);padding:14px}.hub-list button{display:block;width:100%;border:0;border-radius:9px;background:transparent;padding:11px;text-align:left;color:var(--muted);font-size:12px;font-weight:700}.hub-list button.active{background:#fff0f1;color:var(--deep)}.chat{display:flex;min-height:530px;flex-direction:column}.chat-header{padding:19px 20px;border-bottom:1px solid var(--line)}.chat-header h2{margin:0;font:700 18px "Playfair Display"}.chat-header p{margin:4px 0 0;color:var(--muted);font-size:11px}.messages{display:flex;flex:1;flex-direction:column;gap:10px;padding:18px 20px;overflow:auto}.message{align-self:flex-start;max-width:76%;background:#faf5f5;border-radius:4px 12px 12px 12px;padding:10px 12px}.message.mine{align-self:flex-end;background:#ffe8eb;border-radius:12px 4px 12px 12px}.message b{font-size:10px;color:var(--deep)}.message p{margin:3px 0;font-size:12px;line-height:1.4}.message small{color:var(--muted);font-size:9px}.composer{display:flex;gap:8px;border-top:1px solid var(--line);padding:13px}.composer input{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:12px}.guide-grid,.utility-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.guide-card,.utility-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:19px;box-shadow:var(--shadow)}.guide-card h2,.utility-card h2{font:700 17px "Playfair Display";margin:0 0 7px}.guide-card p,.utility-card p{font-size:11px;color:var(--muted);line-height:1.5;min-height:34px}.card-actions{display:flex;gap:7px;margin-top:14px}.card-actions button{padding:8px 10px}.question-editor{margin-top:16px;padding:15px;border:1px solid #f0dddd;border-radius:11px;background:#fffafa}.question-editor h3{font-size:12px;margin:0 0 7px}.question-editor .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.question-editor .remove{float:right;color:#a74350}.question-block{margin:14px 0;padding:16px;border:1px solid var(--line);border-radius:12px;background:white}.question-block h3{font-size:13px;margin:0 0 10px}.option{display:block;width:100%;margin:7px 0;border:1px solid #eddada;border-radius:8px;background:white;padding:10px;text-align:left;font-size:12px}.option.selected{border-color:var(--red);background:#fff0f1}.option.correct{border-color:#6a9d70;background:#edf7eb}.option.wrong{border-color:#df8189;background:#fff0f1}.result{margin:14px 0;padding:13px;border-radius:9px;background:#edf7eb;color:#347442;font-size:12px}.muted{color:var(--muted);font-size:11px}.empty{padding:35px;text-align:center;color:var(--muted)}.hidden{display:none}@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@media(max-width:1150px){main{padding:28px}.lower-grid{grid-template-columns:1fr 1fr}.utility-card:last-child{display:none}.guide-grid,.utility-grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="crest">G</div><div><b>GVCS</b><small>Student Hub</small></div></div>
      <p class="nav-label">Workspace</p>
      <nav class="nav" id="primaryNav">
        <button data-view="dashboard" class="active"><span class="icon">▦</span>Dashboard</button>
        <button data-view="schedule"><span class="icon">□</span>My Schedule</button>
        <button data-view="announcements"><span class="icon">✉</span>Announcements</button>
        <button data-view="study"><span class="icon">▤</span>Study Guides</button>
        <button data-view="community"><span class="icon">◌</span>Community Hubs</button>
      </nav>
      <p class="nav-label">Discover</p>
      <nav class="nav">
        <button data-view="campus"><span class="icon">⌂</span>Campus Utilities</button>
        <button data-view="trivia"><span class="icon">✦</span>Daily Trivia</button>
      </nav>
      <div class="sidebar-spacer"></div>
      <button class="profile-button" id="profileButton"><span class="avatar" id="avatar">GV</span><span><b id="profileName">Your profile</b><small>Personal settings</small></span></button>
    </aside>
    <main id="app"></main>
  </div>
  <script>
    const STORAGE_KEY = 'gvcs-student-hub-v2';
    const todayKey = new Date().toISOString().slice(0, 10);
    const seedState = {
      user: { name: '' },
      announcements: [
        { id:'a1', title:'Fall term community update', body:'Student clubs are now welcoming new members. Explore the Community Hubs to find your people.', author:'GVCS Student Affairs', date:'Today, 8:40 AM', attachment:null, read:false },
        { id:'a2', title:'Biology lab group assignments', body:'Your lab partners have been posted for Friday’s investigation. Please bring your safety goggles.', author:'Dr. Williams', date:'Yesterday', attachment:null, read:false }
      ],
      hubs: {
        qa: [{id:'m1', author:'Mina P.', text:'Does anyone have a good way to remember the stages of mitosis?', time:'9:12 AM', mine:false}],
        helper: [{id:'m2', author:'Theo R.', text:'I am reviewing Psychology research methods at 4 PM in the library. Join if you want a study partner.', time:'8:50 AM', mine:false}],
        free: [{id:'m3', author:'Nora L.', text:'The north café has cinnamon rolls today!', time:'8:36 AM', mine:false}]
      },
      guides: [
        { id:'g1', title:'Psychology: Learning & Memory', subject:'Psychology', questions:[
          {id:'q1', type:'multiple', prompt:'Which process best explains a learned association between a neutral stimulus and an automatic response?', choices:['Classical conditioning','Operant conditioning','Observational learning','Cognitive dissonance'], answer:'Classical conditioning', explanation:'Classical conditioning forms an association between stimuli that produces an automatic response.'},
          {id:'q2', type:'short', prompt:'Explain one difference between short-term memory and long-term memory.', answer:'Short-term memory has limited capacity and duration, while long-term memory stores information for extended periods.', explanation:'A strong answer should compare capacity, duration, or encoding.'},
          {id:'q3', type:'multiple', prompt:'Which research method is most appropriate for testing whether sleep duration causes a change in recall?', choices:['Experiment','Case study','Naturalistic observation','Survey only'], answer:'Experiment', explanation:'An experiment can manipulate sleep duration and control other variables to test causation.'}
        ]},
        { id:'g2', title:'Cell Biology Foundations', subject:'Biology', questions:[
          {id:'q4', type:'multiple', prompt:'Which organelle is primarily responsible for producing ATP in eukaryotic cells?', choices:['Nucleus','Mitochondrion','Ribosome','Golgi apparatus'], answer:'Mitochondrion', explanation:'Mitochondria generate most cellular ATP through aerobic respiration.'},
          {id:'q5', type:'long', prompt:'Describe how the structure of a cell membrane supports selective permeability.', answer:'A phospholipid bilayer with hydrophobic interior restricts many molecules, while proteins regulate passage of specific substances.', explanation:'Mention the phospholipid bilayer and transport proteins.'}
        ]}
      ],
      utilities: { cafe:{open:true, detail:'Open · 8:00 AM–5:00 PM'}, library:{seats:42, detail:'Open until 9:00 PM'}, music:{rooms:3, detail:'Practice rooms available'} },
      reservations: [],
      trivia: { completed:{}, history:[] },
      settings: { lastGuideId:null }
    };
    let state = loadState();
    let currentView = state.user.name ? 'dashboard' : 'welcome';
    let serverSyncTimer = null;
    let activeHub = 'qa';
    let editingGuideId = null;
    let quizSession = null;

    function isAppsScript() { return typeof google !== 'undefined' && google.script && google.script.run; }
    function loadState() { try { const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); return saved ? saved : structuredClone(seedState); } catch { return structuredClone(seedState); } }
    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (!isAppsScript()) return;
      clearTimeout(serverSyncTimer);
      serverSyncTimer = setTimeout(() => {
        google.script.run
          .withFailureHandler(error => console.warn('GVCS server sync failed; local copy remains available.', error))
          .saveAppState(state);
      }, 250);
    }
    function hydrateFromServer() {
      if (!isAppsScript()) return;
      google.script.run
        .withSuccessHandler(serverState => {
          if (serverState && typeof serverState === 'object') {
            state = serverState;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            currentView = state.user && state.user.name ? 'dashboard' : 'welcome';
            render();
          }
        })
        .withFailureHandler(error => console.warn('GVCS is running in local mode because server state could not load.', error))
        .getAppState();
    }
    function uploadAttachment(file, done) {
      if (!file || !file.name) { done(null); return; }
      const localMetadata = { name: file.name, size: file.size, type: file.type };
      if (!isAppsScript()) { done(localMetadata); return; }
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = String(reader.result).split(',')[1];
        google.script.run
          .withSuccessHandler(remoteMetadata => done(remoteMetadata))
          .withFailureHandler(error => { console.warn('Attachment upload failed; only local metadata was saved.', error); done(localMetadata); })
          .uploadAttachment({ name:file.name, mimeType:file.type, base64 });
      };
      reader.onerror = () => done(localMetadata);
      reader.readAsDataURL(file);
    }
    function uid(prefix) { return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`; }
    function escapeHtml(value='') { return String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char])); }
    function greeting() { const hour = new Date().getHours(); return hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening'; }
    function initials(name) { return name.split(/\s+/).filter(Boolean).slice(0,2).map(part => part[0]).join('').toUpperCase() || 'GV'; }
    function header(title, description, action='') { return `<header class="page-header"><div><h1>${title}</h1><p>${description}</p></div>${action}</header>`; }
    function layout(content, title='') { return `<div class="screen">${title ? `<title>${title}</title>` : ''}${content}</div>`; }
    function updateProfile() { document.getElementById('profileName').textContent = state.user.name || 'Your profile'; document.getElementById('avatar').textContent = initials(state.user.name); }
    function setActiveNav(view) { document.querySelectorAll('.nav button').forEach(button => button.classList.toggle('active', button.dataset.view === view)); }
    function route(view) { currentView=view; quizSession=null; editingGuideId=null; render(); window.scrollTo({top:0, behavior:'smooth'}); }

    function render() {
      updateProfile(); setActiveNav(currentView);
      const views = { welcome: renderWelcome, dashboard: renderDashboard, schedule: renderSchedule, announcements: renderAnnouncements, announcementEditor: renderAnnouncementEditor, study: renderStudy, guideEditor: renderGuideEditor, quiz: renderQuiz, community: renderCommunity, campus: renderCampus, trivia: renderTrivia, profile: renderProfile };
      document.getElementById('app').innerHTML = (views[currentView] || renderDashboard)();
      bindView();
    }

    function renderWelcome() { return layout(`<div class="two-column" style="max-width:900px;margin:9vh auto"><section class="form-card"><h2>Welcome to GVCS Student Hub</h2><p>Start with your name. Your workspace will use it for your dashboard greeting, study activity, and community messages.</p><form id="welcomeForm"><div class="field"><label for="welcomeName">Preferred name</label><input id="welcomeName" required maxlength="40" placeholder="e.g. stu6034"></div><div class="form-actions"><button class="red-button">Set up my workspace →</button></div></form></section><aside class="info-card"><h2>One workspace, your way</h2><p>Create your own study guides, edit announcements, join student conversations, and keep track of useful campus availability.</p><p class="muted">Your prototype data is saved only in this browser until a backend is connected.</p></aside></div>`); }
    function renderDashboard() {
      const unread = state.announcements.filter(item => !item.read).length;
      return layout(`<div class="topbar"><span class="date"><i>●</i> ${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</span><div class="top-actions"><label class="search">⌕<input id="globalSearch" placeholder="Go to a workspace" aria-label="Go to a workspace"></label><button class="circle-button" data-go="announcements" title="Open announcements">✉</button><span class="avatar">${initials(state.user.name)}</span></div></div>${header(`${greeting()}, ${escapeHtml(state.user.name)}.`, `You have ${unread ? `${unread} announcement${unread>1?'s':''} to review` : 'a clear inbox'} and a full day ahead.`, '<button class="red-button" data-go="study">＋ Create study guide</button>')}<section class="dashboard-grid"><article class="card schedule-card"><div class="card-head"><h2>Today’s schedule</h2><button class="small-button" data-go="schedule">View full schedule →</button></div><div class="days"><div class="day">MON<b>7</b></div><div class="day">TUE<b>8</b></div><div class="day today">WED<b>9</b></div><div class="day">THU<b>10</b></div><div class="day">FRI<b>11</b></div></div>${eventRow('09:00','10:15','Advanced Biology','Room B-204 · Dr. Williams','NOW')}${eventRow('11:30','12:45','Creative Writing','Library Studio · M. Chen','1h 20m')}${eventRow('14:00','15:30','Psychology Seminar','Hall 3 · Prof. Patel','')}</article><article class="card focus-card"><div class="card-head"><h2>Focus session</h2><button class="small-button" style="color:#ffc7cf" data-go="study">Study guide →</button></div><div class="focus-time" id="timer">25:00</div><div class="progress"><i></i></div><div class="focus-footer"><span>68% of today’s goal</span><button id="focusButton">Start focus</button></div></article></section><section class="lower-grid"><article class="card mini-card"><div class="card-head"><h2>Announcement inbox</h2><button class="small-button" data-go="announcements">Open inbox →</button></div>${state.announcements.slice(0,3).map(item=>`<div class="announcement-mini"><b>${escapeHtml(item.title)}</b><p>${escapeHtml(item.author)} · ${escapeHtml(item.date)}</p></div>`).join('')}</article><article class="card mini-card"><div class="card-head"><h2>Study guide</h2><button class="small-button" data-go="study">My guides →</button></div><p class="muted">Build your own questions, explanations, and practice sessions.</p><div class="topic-row"><button data-go="study">Psychology</button><button data-go="study">Biology</button></div><button class="red-button" data-go="study">Open study workspace</button></article><article class="card mini-card"><div class="card-head"><h2>Campus right now</h2><button class="small-button" data-go="campus">Utilities →</button></div><div class="utility">☕ Study Café <span class="status">${state.utilities.cafe.open?'Open':'Closed'}</span></div><div class="utility">▦ Library <span class="status">${state.utilities.library.seats} seats</span></div><div class="utility">♫ Music rooms <span class="status">${state.utilities.music.rooms} left</span></div></article></section><section class="trivia-strip"><span style="font-size:22px">✦</span><p><b>Daily brain break.</b> Try today’s more challenging question and build your streak.</p><button class="small-button" data-go="trivia">Open daily trivia →</button></section>`); }
    function eventRow(start,end,title,place,tag){return `<div class="event"><time>${start}<small>— ${end}</small></time><i class="event-dot"></i><div><b>${title}</b><p>${place}</p></div>${tag?`<span class="tag">${tag}</span>`:''}</div>`}
    function renderSchedule() { return layout(`${header('My schedule','A clearer view of classes, study time, and personal planning.','<button class="red-button" data-go="study">＋ Plan a study session</button>')}<div class="list">${[['Advanced Biology','Today · 9:00–10:15 · Room B-204 · Dr. Williams','Now'],['Creative Writing','Today · 11:30–12:45 · Library Studio · M. Chen','Next'],['Psychology Seminar','Today · 2:00–3:30 · Hall 3 · Prof. Patel','Later'],['Independent study','Today · 4:00–5:00 · Library','Plan']].map(item=>`<article class="list-item"><div><b>${item[0]}</b><p>${item[1]}</p></div><span class="tag">${item[2]}</span></article>`).join('')}</div>`); }
    function renderAnnouncements() { return layout(`${header('Announcement inbox','Create, update, attach, and review school communications.','<button class="red-button" data-go="announcementEditor">＋ New announcement</button>')}<section class="list">${state.announcements.length ? state.announcements.map(item=>`<article class="list-item" data-announcement-id="${item.id}"><div><b>${!item.read?'● ':''}${escapeHtml(item.title)}</b><p>${escapeHtml(item.body)}</p><p>${escapeHtml(item.author)} · ${escapeHtml(item.date)}${item.attachment?` · 📎 ${escapeHtml(item.attachment.name)}`:''}</p></div><div class="card-actions"><button class="secondary-button" data-edit-announcement="${item.id}">Edit</button><button class="small-button" data-toggle-read="${item.id}">${item.read?'Mark unread':'Mark read'}</button></div></article>`).join(''):'<div class="empty">No announcements yet. Create the first update for your workspace.</div>'}</section>`); }
    function renderAnnouncementEditor() { const item = state.announcements.find(a=>a.id===editingGuideId) || {title:'',body:'',author:state.user.name,date:'Today'}; return layout(`${header(item.id?'Edit announcement':'New announcement','Announcements are stored locally now and can be mapped to a future upload API.','<button class="secondary-button" data-go="announcements">← Inbox</button>')}<form class="form-card" id="announcementForm" style="max-width:760px"><input type="hidden" name="id" value="${item.id||''}"><div class="field"><label>Announcement title</label><input name="title" required value="${escapeHtml(item.title)}" placeholder="Add a clear title"></div><div class="field"><label>Message</label><textarea name="body" required placeholder="Write the update..."></textarea></div><div class="field"><label>Author / source</label><input name="author" required value="${escapeHtml(item.author)}"></div><div class="field"><label>Attachment (file metadata is saved in this prototype)</label><input name="attachment" type="file"></div><p class="muted">Existing attachment: ${item.attachment?escapeHtml(item.attachment.name):'None'}</p><div class="form-actions"><button type="button" class="secondary-button" data-go="announcements">Cancel</button><button class="red-button">Save announcement</button></div></form>`); }
    function renderStudy() { return layout(`${header('Study guide library','Create rich question banks, revise them later, and practise with several questions.','<button class="red-button" id="newGuide">＋ New study guide</button>')}<section class="guide-grid">${state.guides.map(guide=>`<article class="guide-card"><h2>${escapeHtml(guide.title)}</h2><p>${escapeHtml(guide.subject)} · ${guide.questions.length} saved question${guide.questions.length===1?'':'s'}</p><div class="card-actions"><button class="red-button" data-quiz-guide="${guide.id}">Practise</button><button class="secondary-button" data-edit-guide="${guide.id}">Edit</button></div></article>`).join('')}</section><section class="info-card" style="margin-top:20px"><h2>How it works</h2><p>A guide can contain multiple-choice, short-answer, and long-response questions. Save answers and explanations so every practice session has useful feedback.</p></section>`); }
    function renderGuideEditor() { const guide = state.guides.find(g=>g.id===editingGuideId) || {id:'',title:'',subject:'',questions:[]}; return layout(`${header(guide.id?'Edit study guide':'Create study guide','Add varied questions, accepted answers, and explanations for better practice.','<button class="secondary-button" data-go="study">← Guide library</button>')}<section class="two-column"><form class="form-card" id="guideForm"><input type="hidden" name="guideId" value="${guide.id}"><div class="field"><label>Guide title</label><input name="title" required value="${escapeHtml(guide.title)}" placeholder="e.g. Chemistry: Atomic Structure"></div><div class="field"><label>Subject</label><input name="subject" required value="${escapeHtml(guide.subject)}" placeholder="e.g. Chemistry"></div><div id="questionEditors">${guide.questions.map(questionEditor).join('')}</div><button type="button" class="secondary-button" id="addQuestion">＋ Add question</button><div class="form-actions"><button type="button" class="secondary-button" data-go="study">Cancel</button><button class="red-button">Save guide</button></div></form><aside class="info-card"><h2>Question tips</h2><p><b>Multiple choice:</b> provide four plausible choices and mark the correct response.</p><p><b>Short or long answer:</b> write an accepted-answer guide and an explanation that helps you improve.</p></aside></section>`); }
    function questionEditor(question={type:'multiple',prompt:'',choices:['','','',''],answer:'',explanation:''}) { const choices = question.choices || ['','','','']; return `<article class="question-editor"><button type="button" class="small-button remove" data-remove-question>Remove</button><h3>Question</h3><div class="field"><label>Question type</label><select name="qType"><option value="multiple" ${question.type==='multiple'?'selected':''}>Multiple choice</option><option value="short" ${question.type==='short'?'selected':''}>Short answer</option><option value="long" ${question.type==='long'?'selected':''}>Long response</option></select></div><div class="field"><label>Prompt</label><textarea name="qPrompt" required>${escapeHtml(question.prompt)}</textarea></div><div class="choice-fields ${question.type==='multiple'?'':'hidden'}"><div class="grid">${[0,1,2,3].map(i=>`<div class="field"><label>Choice ${i+1}</label><input name="qChoice" value="${escapeHtml(choices[i]||'')}"></div>`).join('')}</div></div><div class="field"><label>Correct / accepted answer</label><input name="qAnswer" required value="${escapeHtml(question.answer)}"></div><div class="field"><label>Explanation shown after solving</label><textarea name="qExplanation" required>${escapeHtml(question.explanation)}</textarea></div></article>`; }
    function renderQuiz() { if (!quizSession) { route('study'); return ''; } const guide=state.guides.find(g=>g.id===quizSession.guideId); const question=guide.questions[quizSession.index]; return layout(`${header(`${escapeHtml(guide.title)} practice`,`Question ${quizSession.index+1} of ${guide.questions.length} · ${quizSession.score} correct so far.`,'<button class="secondary-button" data-go="study">Finish later</button>')}<section class="form-card" style="max-width:820px"><div class="question-block"><h3>${escapeHtml(question.prompt)}</h3>${question.type==='multiple'?`<div>${question.choices.map(choice=>`<button class="option" data-answer="${escapeHtml(choice)}">${escapeHtml(choice)}</button>`).join('')}</div>`:`<div class="field"><label>Your response</label><textarea id="writtenAnswer" placeholder="Write a considered answer..."></textarea></div><button class="red-button" id="checkWritten">Check my answer</button>`}<div id="answerFeedback"></div></div></section>`); }
    function renderCommunity() { const hubNames={qa:['Q&A Hub','Ask coursework or campus questions and mark helpful replies.'],helper:['Study Helper','Coordinate sessions and find a study partner.'],free:['Free Hub','A relaxed space for student conversation.']}; const messages=state.hubs[activeHub]||[]; return layout(`${header('Community hubs','Three dedicated spaces for questions, collaborative study, and free conversation.')}<section class="chat-layout"><aside class="hub-list"><button data-hub="qa" class="${activeHub==='qa'?'active':''}">◉ Q&A</button><button data-hub="helper" class="${activeHub==='helper'?'active':''}">✦ Study Helper</button><button data-hub="free" class="${activeHub==='free'?'active':''}">♡ Free</button></aside><div class="chat"><header class="chat-header"><h2>${hubNames[activeHub][0]}</h2><p>${hubNames[activeHub][1]}</p></header><div class="messages" id="messages">${messages.map(message=>`<article class="message ${message.mine?'mine':''}"><b>${escapeHtml(message.author)}</b><p>${escapeHtml(message.text)}</p><small>${escapeHtml(message.time)}</small></article>`).join('')}</div><form class="composer" id="messageForm"><input name="message" required maxlength="500" placeholder="Write a message to ${hubNames[activeHub][0]}..."><button class="red-button">Send</button></form></div></section>`); }
    function renderCampus() { const u=state.utilities; return layout(`${header('Campus utilities','Useful availability information, ready for a future live data connection.','<button class="secondary-button" id="manageUtilities">Manage availability</button>')}<section class="utility-grid"><article class="utility-card"><h2>☕ Study Café</h2><p>${u.cafe.detail}</p><span class="status">${u.cafe.open?'Open now':'Closed'}</span></article><article class="utility-card"><h2>▦ Library</h2><p>${u.library.detail}</p><span class="status">${u.library.seats} seats left</span></article><article class="utility-card"><h2>♫ Music practice rooms</h2><p>${u.music.detail}</p><button class="red-button" id="reserveMusic" ${u.music.rooms<1?'disabled':''}>${u.music.rooms>0?'Reserve a room':'No rooms available'}</button></article></section><section class="form-card hidden" id="utilityManager" style="margin-top:20px;max-width:700px"><h2>Manage prototype availability</h2><p>These controls demonstrate how an authorized campus system could update live status.</p><form id="utilityForm"><div class="field"><label>Study Café status</label><select name="cafeOpen"><option value="true" ${u.cafe.open?'selected':''}>Open</option><option value="false" ${!u.cafe.open?'selected':''}>Closed</option></select></div><div class="field"><label>Library seats left</label><input name="librarySeats" type="number" min="0" max="500" value="${u.library.seats}"></div><div class="field"><label>Music rooms left</label><input name="musicRooms" type="number" min="0" max="30" value="${u.music.rooms}"></div><div class="form-actions"><button class="red-button">Save availability</button></div></form></section><div id="campusResult"></div>`); }
    function dailyQuestion(){const questions=[{q:'A researcher observes a positive correlation between study time and test score. Which conclusion is most justified?',choices:['Studying more causes higher scores','Higher scores cause more studying','The variables are associated, but causation is not established','There is no relationship between the variables'],answer:2,explain:'Correlation establishes an association, not causation. Other variables or reverse causality may be involved.'},{q:'A 1.5 kg object accelerates at 4 m/s². What net force acts on it?',choices:['2.5 N','5 N','6 N','8 N'],answer:2,explain:'Newton’s second law is F = ma, so 1.5 × 4 = 6 N.'},{q:'A primary source is best defined as:',choices:['A textbook summary','An original record created during the time under study','A modern review article','A fictional retelling'],answer:1,explain:'Primary sources are direct, original evidence from the period or event being investigated.'}]; const index=[...todayKey].reduce((sum,char)=>sum+char.charCodeAt(0),0)%questions.length; return {...questions[index], id:`${todayKey}-${index}`};}
    function renderTrivia(){const question=dailyQuestion();const completed=state.trivia.completed[question.id];const streak=calculateStreak();return layout(`${header('Daily trivia',`Current streak: ${streak} day${streak===1?'':'s'} · Thoughtful questions with explanations.`)}<section class="two-column"><article class="form-card"><h2>Today’s challenge</h2><p>${escapeHtml(question.q)}</p><div id="triviaOptions">${question.choices.map((choice,index)=>`<button class="option" data-trivia-option="${index}" ${completed?'disabled':''}>${escapeHtml(choice)}</button>`).join('')}</div>${completed?`<div class="result">${completed.correct?'Correct! ': 'Completed. '}${escapeHtml(question.explain)}</div>`:'<div id="triviaFeedback"></div>'}</article><aside class="info-card"><h2>Recent progress</h2><p>${state.trivia.history.length?state.trivia.history.slice(-5).reverse().map(item=>`${item.date}: ${item.correct?'Correct':'Practised'}`).join('<br>'):'Complete a question to begin your history.'}</p><p class="muted">New questions are selected from a date-based bank in this prototype.</p></aside></section>`);}
    function calculateStreak(){let streak=0;let cursor=new Date();while(true){const key=cursor.toISOString().slice(0,10);if(!state.trivia.history.some(item=>item.date===key))break;streak++;cursor.setDate(cursor.getDate()-1);}return streak;}
    function renderProfile(){return layout(`${header('Profile & data','Update your workspace identity or reset this browser-only prototype.','<button class="secondary-button" data-go="dashboard">← Dashboard</button>')}<section class="two-column"><form class="form-card" id="profileForm"><h2>Your details</h2><div class="field"><label>Preferred name</label><input name="name" required maxlength="40" value="${escapeHtml(state.user.name)}"></div><div class="form-actions"><button class="red-button">Save profile</button></div></form><aside class="info-card"><h2>Prototype storage</h2><p>Messages, guides, announcements, and availability are saved in this browser with <code>localStorage</code>. A real website can replace these state functions with authenticated API calls.</p><button class="secondary-button" id="resetData">Reset local data</button></aside></section>`);}

    function bindView(){
      document.querySelectorAll('[data-go]').forEach(button=>button.addEventListener('click',()=>route(button.dataset.go)));
      document.getElementById('profileButton').onclick=()=>route('profile');
      const welcome=document.getElementById('welcomeForm'); if(welcome) welcome.addEventListener('submit',event=>{event.preventDefault();state.user.name=event.target.welcomeName.value.trim();saveState();route('dashboard');});
      const search=document.getElementById('globalSearch'); if(search) search.addEventListener('keydown',event=>{if(event.key==='Enter'){const term=search.value.toLowerCase();route(term.includes('announce')?'announcements':term.includes('study')||term.includes('quiz')?'study':term.includes('campus')||term.includes('library')?'campus':term.includes('chat')||term.includes('community')?'community':'schedule');}});
      const focus=document.getElementById('focusButton'); if(focus) bindFocusTimer(focus);
      document.querySelectorAll('[data-edit-announcement]').forEach(button=>button.addEventListener('click',()=>{editingGuideId=button.dataset.editAnnouncement;route('announcementEditor');}));
      document.querySelectorAll('[data-toggle-read]').forEach(button=>button.addEventListener('click',()=>{const item=state.announcements.find(a=>a.id===button.dataset.toggleRead);item.read=!item.read;saveState();render();}));
      const announcementForm=document.getElementById('announcementForm'); if(announcementForm) announcementForm.addEventListener('submit',saveAnnouncement);
      const newGuide=document.getElementById('newGuide'); if(newGuide)newGuide.onclick=()=>{editingGuideId=null;route('guideEditor');};
      document.querySelectorAll('[data-edit-guide]').forEach(button=>button.addEventListener('click',()=>{editingGuideId=button.dataset.editGuide;route('guideEditor');}));
      document.querySelectorAll('[data-quiz-guide]').forEach(button=>button.addEventListener('click',()=>{quizSession={guideId:button.dataset.quizGuide,index:0,score:0,answers:[]};route('quiz');}));
      const addQuestion=document.getElementById('addQuestion'); if(addQuestion)addQuestion.onclick=()=>{document.getElementById('questionEditors').insertAdjacentHTML('beforeend',questionEditor());bindQuestionEditors();};
      const guideForm=document.getElementById('guideForm'); if(guideForm)guideForm.addEventListener('submit',saveGuide);bindQuestionEditors();
      document.querySelectorAll('[data-answer]').forEach(button=>button.addEventListener('click',()=>gradeMultiple(button.dataset.answer)));
      const checkWritten=document.getElementById('checkWritten'); if(checkWritten)checkWritten.onclick=()=>gradeWritten();
      document.querySelectorAll('[data-hub]').forEach(button=>button.addEventListener('click',()=>{activeHub=button.dataset.hub;render();}));
      const messageForm=document.getElementById('messageForm'); if(messageForm)messageForm.addEventListener('submit',sendMessage);
      const reserve=document.getElementById('reserveMusic'); if(reserve)reserve.onclick=reserveMusic;
      const manager=document.getElementById('manageUtilities'); if(manager)manager.onclick=()=>document.getElementById('utilityManager').classList.remove('hidden');
      const utilityForm=document.getElementById('utilityForm'); if(utilityForm)utilityForm.addEventListener('submit',saveUtilities);
      document.querySelectorAll('[data-trivia-option]').forEach(button=>button.addEventListener('click',()=>answerTrivia(Number(button.dataset.triviaOption))));
      const profileForm=document.getElementById('profileForm'); if(profileForm)profileForm.addEventListener('submit',event=>{event.preventDefault();state.user.name=new FormData(profileForm).get('name').trim();saveState();route('dashboard');});
      const reset=document.getElementById('resetData'); if(reset)reset.onclick=()=>{localStorage.removeItem(STORAGE_KEY);state=structuredClone(seedState);route('welcome');};
    }
    function bindQuestionEditors(){document.querySelectorAll('[data-remove-question]').forEach(button=>button.onclick=()=>button.closest('.question-editor').remove());document.querySelectorAll('select[name="qType"]').forEach(select=>select.onchange=()=>select.closest('.question-editor').querySelector('.choice-fields').classList.toggle('hidden',select.value!=='multiple'));}
    function saveAnnouncement(event){event.preventDefault();const data=new FormData(event.target);const file=data.get('attachment');const existing=state.announcements.find(a=>a.id===data.get('id'));uploadAttachment(file, attachment=>{const item={id:existing?.id||uid('a'),title:data.get('title').trim(),body:data.get('body').trim(),author:data.get('author').trim(),date:'Just now',attachment:attachment||existing?.attachment||null,read:false};if(existing)Object.assign(existing,item);else state.announcements.unshift(item);saveState();route('announcements');});}
    function saveGuide(event){event.preventDefault();const form=event.target;const editors=[...form.querySelectorAll('.question-editor')];const questions=editors.map(editor=>{const type=editor.querySelector('[name="qType"]').value;return{id:uid('q'),type,prompt:editor.querySelector('[name="qPrompt"]').value.trim(),choices:type==='multiple'?[...editor.querySelectorAll('[name="qChoice"]')].map(input=>input.value.trim()):[],answer:editor.querySelector('[name="qAnswer"]').value.trim(),explanation:editor.querySelector('[name="qExplanation"]').value.trim()};}).filter(question=>question.prompt&&question.answer);const data=new FormData(form);const existing=state.guides.find(g=>g.id===data.get('guideId'));const guide={id:existing?.id||uid('g'),title:data.get('title').trim(),subject:data.get('subject').trim(),questions};if(existing)Object.assign(existing,guide);else state.guides.push(guide);saveState();route('study');}
    function nextQuiz(){const guide=state.guides.find(g=>g.id===quizSession.guideId);if(quizSession.index<guide.questions.length-1){quizSession.index++;render();}else{const score=quizSession.score;document.getElementById('app').innerHTML=layout(`${header('Practice complete',`You scored ${score} out of ${guide.questions.length}.`,'<button class="red-button" data-go="study">Back to guides</button>')}<section class="result">Review your guide, edit explanations, or try another practice session when you are ready.</section>`);bindView();}}
    function gradeMultiple(answer){const guide=state.guides.find(g=>g.id===quizSession.guideId),question=guide.questions[quizSession.index],correct=answer===question.answer;document.querySelectorAll('[data-answer]').forEach(button=>{button.disabled=true;button.classList.add(button.dataset.answer===question.answer?'correct':button.dataset.answer===answer?'wrong':'');});if(correct)quizSession.score++;document.getElementById('answerFeedback').innerHTML=`<div class="result"><b>${correct?'Correct.':'Keep working at it.'}</b> ${escapeHtml(question.explanation)}<br><button class="red-button" id="nextQuestion" style="margin-top:10px">${quizSession.index===guide.questions.length-1?'See result':'Next question'}</button></div>`;document.getElementById('nextQuestion').onclick=nextQuiz;}
    function gradeWritten(){const guide=state.guides.find(g=>g.id===quizSession.guideId),question=guide.questions[quizSession.index],answer=document.getElementById('writtenAnswer').value.trim();if(!answer)return;quizSession.score++;document.getElementById('answerFeedback').innerHTML=`<div class="result"><b>Response saved for reflection.</b> Suggested answer: ${escapeHtml(question.answer)}<br>${escapeHtml(question.explanation)}<br><button class="red-button" id="nextQuestion" style="margin-top:10px">${quizSession.index===guide.questions.length-1?'See result':'Next question'}</button></div>`;document.getElementById('nextQuestion').onclick=nextQuiz;}
    function sendMessage(event){event.preventDefault();const input=event.target.elements.message,text=input.value.trim();if(!text)return;state.hubs[activeHub].push({id:uid('m'),author:state.user.name,text,time:new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}),mine:true});saveState();render();}
    function reserveMusic(){if(state.utilities.music.rooms<1)return;state.utilities.music.rooms--;state.reservations.push({id:uid('r'),type:'Music practice room',date:new Date().toLocaleString()});saveState();document.getElementById('campusResult').innerHTML='<div class="result">Music practice room reserved for the next 60 minutes.</div>';document.getElementById('reserveMusic').textContent='Reserved ✓';document.getElementById('reserveMusic').disabled=true;}
    function saveUtilities(event){event.preventDefault();const data=new FormData(event.target);state.utilities.cafe.open=data.get('cafeOpen')==='true';state.utilities.cafe.detail=state.utilities.cafe.open?'Open · 8:00 AM–5:00 PM':'Closed · Opens tomorrow at 8:00 AM';state.utilities.library.seats=Math.max(0,Number(data.get('librarySeats')));state.utilities.library.detail=`Open until 9:00 PM`;state.utilities.music.rooms=Math.max(0,Number(data.get('musicRooms')));state.utilities.music.detail='Practice rooms available';saveState();render();}
    function answerTrivia(index){const question=dailyQuestion(),correct=index===question.answer;state.trivia.completed[question.id]={correct};state.trivia.history=state.trivia.history.filter(item=>item.date!==todayKey);state.trivia.history.push({date:todayKey,correct});saveState();render();}
    let timerId=null,seconds=1500;function bindFocusTimer(button){button.onclick=()=>{if(timerId){clearInterval(timerId);timerId=null;button.textContent='Resume focus';return;}button.textContent='Pause focus';timerId=setInterval(()=>{seconds--;const timer=document.getElementById('timer');if(timer)timer.textContent=`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;if(seconds<=0){clearInterval(timerId);timerId=null;button.textContent='Complete';}},1000);};}
    document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>route(button.dataset.view)));
    render();
    hydrateFromServer();
  </script>
</body>
</html>
